# Tests: Node suites + page tests on SwiftShader (ubuntu, sharded), and real-GPU page tests on the owner's Mac (self-hosted).
# No secrets. See tests/RUNNER.md for what each job covers and how to register the Mac runner.
name: tests
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
concurrency: { group: "tests-${{ github.ref }}", cancel-in-progress: true }
permissions: { contents: read }
env:
  FORCE_COLOR: "1"

jobs:
  node:
    name: node suites (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy: { fail-fast: false, matrix: { shard: [1, 2] } }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }          # suites `git show <old sha>:js/...` for baseline comparisons
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium   # tests/flux-cli.js drives a browser
      - name: "node --test (the gate's node: entries)"
        env: { PLAYWRIGHT: "${{ github.workspace }}/tests/runner/pw-shim.js" }
        run: >
          node tests/runner/node-suites.js --test-shard=${{ matrix.shard }}/2
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=junit --test-reporter-destination=test-reports/node-${{ matrix.shard }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "node-junit-${{ matrix.shard }}", path: test-reports/, retention-days: 14 }

  page:
    name: page tests SwiftShader (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy: { fail-fast: false, matrix: { shard: [1, 2, 3, 4] } }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # @hash: frame hashes pinned on the Mac GPU, wrong on SwiftShader by construction (page-hash job below)
      # @gpu: needs a real GPU (gpu-mac job); @solo: timing-sensitive, run alone (page-solo job)
      - run: npx playwright test --config tests/pw/playwright.config.js --project=chromium --grep-invert "@hash|@gpu|@solo" --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "blob-page-${{ matrix.shard }}", path: blob-report/, retention-days: 7 }

  page-solo:
    name: page tests SwiftShader, solo
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config tests/pw/playwright.config.js --project=chromium --grep @solo --grep-invert "@hash|@gpu" --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: blob-page-solo, path: blob-report/, retention-days: 7 }

  page-hash:
    # Informational until the tolerance comparison replaces the pinned hashes: runs, reports, never blocks.
    name: hash-pinned frame tests on SwiftShader (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config tests/pw/playwright.config.js --project=chromium --grep @hash --grep-invert "@gpu"
        env: { PW_RETRIES: "0" }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: blob-page-hash, path: blob-report/, retention-days: 7 }

  webkit:
    # WebKit approximates Safari (the primary engine). On ubuntu its GL is software too, so treat this as an engine smoke
    # test, not a rendering check; non-blocking until a first green baseline exists.
    name: page tests WebKit (${{ matrix.shard }}/2, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    strategy: { fail-fast: false, matrix: { shard: [1, 2] } }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test --config tests/pw/playwright.config.js --project=webkit --grep-invert "@hash|@gpu|@solo" --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "blob-webkit-${{ matrix.shard }}", path: blob-report/, retention-days: 7 }

  report:
    name: merge page reports
    if: always()
    needs: [page, page-solo, page-hash, webkit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { pattern: "blob-*", path: all-blobs, merge-multiple: true }
      - run: npx playwright merge-reports --reporter html,junit ./all-blobs
        env: { PLAYWRIGHT_HTML_OUTPUT_DIR: test-reports/page-html, PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-reports/page-junit.xml }
      - uses: actions/upload-artifact@v4
        with: { name: page-report, path: test-reports/, retention-days: 14 }

  gpu-mac:
    # Real GPU: the owner's Apple Silicon Mac as a self-hosted runner (setup: tests/RUNNER.md). Opt-in with the repository
    # variable MAC_GPU_RUNNER=true (Settings > Secrets and variables > Actions > Variables; a variable, not a secret), so the
    # job does not sit queued forever where no such runner exists. Never runs code from fork PRs on the Mac.
    name: page tests real GPU (Mac)
    if: >-
      vars.MAC_GPU_RUNNER == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64, gpu]
    timeout-minutes: 240
    env: { PW_GL: native, PW_PORT: "8745" }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx playwright install chromium webkit
      # three invocations: each blob report gets its own folder (the blob reporter empties its folder on start)
      - name: chromium pool (everything but @solo)
        env: { PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report/chromium }
        run: npx playwright test --config tests/pw/playwright.config.js --project=chromium --grep-invert @solo
      - name: chromium solo, alone
        if: always()
        env: { PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report/solo }
        run: npx playwright test --config tests/pw/playwright.config.js --project=chromium --grep @solo --workers=1
      - name: webkit
        if: always()
        env: { PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report/webkit }
        run: npx playwright test --config tests/pw/playwright.config.js --project=webkit --grep-invert @solo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-mac-blobs
          path: blob-report/
          retention-days: 14
