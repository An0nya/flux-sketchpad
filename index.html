<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flux — reflector sketchpad</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<noscript><div class="boot-error">This tool needs JavaScript.</div></noscript>
<div id="boot-error" class="boot-error" hidden></div>

<!-- Icons: Lucide (lucide.dev), ISC License, © Lucide Icons and Contributors — inlined, unmodified paths. -->
<header class="topbar">
  <a class="brand" href="./" title="Flux — reflector sketchpad"><span class="mark">◈</span><strong>FLUX</strong></a>
  <div class="hdr-right">
    <span id="run-state" class="status" title="">READY</span>
    <button id="btn-undo" class="icon" disabled title="Undo" aria-label="Undo"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/></svg></button>
    <button id="btn-redo" class="icon" disabled title="Redo" aria-label="Redo"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5A5.5 5.5 0 0 0 9.5 20H13"/></svg></button>
    <button id="btn-generate-top" class="primary" title="Re-solve the reflector for the painted target and re-trace">Rebuild</button>
    <button id="btn-snapshot" class="text" title="Save a snapshot in this browser (separate from autosave)">Save</button>
    <button id="btn-restore" class="text">Restore</button>
    <button id="btn-side" class="icon" aria-pressed="true" title="Show / hide settings" aria-label="Toggle settings"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/></svg></button>
  </div>
  <div class="progress-line" aria-hidden="true"><div id="progress-bar"></div></div>
  <div id="progress-strip" class="progress-strip" aria-live="polite"><span id="progress-text">—</span></div>
</header>

<div class="app">
<div class="work-col">
<nav class="pane-tabs" id="pane-tabs" aria-label="Panes"><button data-tab="scene">Scene</button><button data-tab="editor">Editor</button><button data-tab="result">Result</button><button data-tab="optics">Optics</button></nav>
<main class="workspace" id="workspace">
  <section class="pane scene-pane" data-pane="scene">
    <div class="pane-head"><button class="collapse" data-collapse="scene" aria-label="Collapse Scene" title="Collapse / restore">▾</button><h2 data-collapse="scene">Scene</h2><div class="head-tools"><div class="seg" role="group" aria-label="Scene view extent"><button data-fit="fixture" class="on">Fixture</button><button data-fit="all">Whole scene</button></div><label class="tog lens" title="Lens focal length, 35 mm-equivalent. ∞ = orthographic (no perspective).">lens <input type="range" id="lens" min="0" max="100" step="1" value="100"> <output id="lens-out">∞</output></label></div><button class="expand icon" data-expand="scene" aria-label="Expand Scene" title="Expand">⤢</button></div>
    <div class="canvas-wrap"><canvas id="scene-canvas" aria-label="3D scene view"></canvas>
      <div class="hint" id="scene-hint"></div></div>
  </section>
  <div class="divider v" data-split="split" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Resize Scene"></div>
  <div class="right" id="right">
    <div class="pair" id="pair">
      <section class="pane editor-pane" data-pane="editor">
        <div class="pane-head"><button class="collapse" data-collapse="editor" aria-label="Collapse Editor" title="Collapse / restore">▾</button><h2 data-collapse="editor">Editor</h2><div class="head-tools"><nav class="modes seg" role="tablist" aria-label="Input mode"><button role="tab" data-mode="A" title="Paint a target; tile it with source images">Paint</button><button role="tab" data-mode="B" title="Stamp tiles on the target; solve the facet for each">Stamp</button><button role="tab" data-mode="C" title="Draw a cross-section; revolve or extrude it">Profile</button></nav></div><button class="expand icon" data-expand="editor" aria-label="Expand Editor" title="Expand">⤢</button></div>
        <figure class="map">
          <figcaption id="left-caption">Intended</figcaption>
          <div class="canvas-wrap sq"><canvas id="left-canvas"></canvas><button class="icon reset-view" data-reset="left" title="Reset zoom (or double-click)" aria-label="Reset zoom">⌖</button></div>
          <div class="toolrow" id="left-tools"></div>
        </figure>
      </section>
      <div class="divider pd" data-split="pairSplit" role="separator" tabindex="0" aria-label="Resize Editor and Result"></div>
      <section class="pane result-pane" data-pane="result">
        <div class="pane-head"><button class="collapse" data-collapse="result" aria-label="Collapse Result" title="Collapse / restore">▾</button><h2 data-collapse="result">Result</h2><div class="head-tools"><div class="seg" id="heat-display" role="radiogroup" aria-label="Simulated view" title="Changes the PICTURE only. Every statistic uses the raw sim grid."><button data-disp="hits">Ray hits</button><button data-disp="grid" class="on">Grid</button><button data-disp="smooth">Smoothed</button></div></div><button class="expand icon" data-expand="result" aria-label="Expand Result" title="Expand">⤢</button></div>
        <figure class="map">
          <figcaption id="right-caption">Simulated</figcaption>
          <div class="canvas-wrap sq"><canvas id="heat-canvas"></canvas><button class="icon reset-view" data-reset="heat" title="Reset zoom (or double-click)" aria-label="Reset zoom">⌖</button></div>
          <div class="colorbar" id="colorbar"></div>
        </figure>
      </section>
    </div>
    <div class="divider h" data-split="rowSplit" role="separator" tabindex="0" aria-orientation="horizontal" aria-label="Resize maps and Optics"></div>
    <section class="pane optics-pane" data-pane="optics">
      <div class="pane-head"><button class="collapse" data-collapse="optics" aria-label="Collapse Optics" title="Collapse / restore">▾</button><h2 data-collapse="optics">Optics</h2><div class="head-tools"><select data-control-view="surfaceView" aria-label="Surface view style"><option value="shaded">shaded + normals</option><option value="pairs">ray pairs</option></select></div><button class="expand icon" data-expand="optics" aria-label="Expand Optics" title="Expand">⤢</button></div>
      <div class="canvas-wrap"><canvas id="surface-canvas" aria-label="Optics view"></canvas></div>
    </section>
  </div>
</main>

  <footer class="panel stats-panel">
    <div class="stats-min">
      <div class="min-head"><div class="min-row" id="min-row"></div><button id="btn-details" class="mini" aria-expanded="false" aria-controls="stats-full">Details ▾</button></div>
      <div class="energy" id="min-bar" title="where the rays went"></div>
      <div class="min-limits" id="min-limits"></div>
    </div>
    <div class="stats-grid" id="stats-full" hidden>
      <div class="stats" id="stats"></div>
      <div class="feas" id="feasibility" aria-live="polite"></div>
    </div>
    <div class="notices" id="notices"></div>
  </footer>
</div>

  <aside class="side" id="sidebar" aria-label="Settings">
    <div class="side-top">
    <div class="file-row">
      <button id="btn-download" title="Download the whole scene as one JSON file">Save to disk</button>
      <label class="filebtn" title="Load a scene JSON file">Open from disk<input id="file-input" type="file" accept=".json,application/json" hidden></label>
      <button id="btn-reset" class="danger" data-confirm="Reset the whole scene?">Reset</button>
    </div>
    <nav class="modes seg" role="tablist" aria-label="Input mode">
      <button role="tab" data-mode="A">Paint</button><button role="tab" data-mode="B">Stamp</button><button role="tab" data-mode="C">Profile</button>
    </nav>
    <select id="preset-select" aria-label="Scene preset">
      <option value="">Presets…</option>
      <option value="headlamp">Headlamp beam (Mode A)</option>
      <option value="deepbox">Tall deep box, source on side wall (Mode A)</option>
      <option value="stamps">Three stamped tiles (Mode B)</option>
      <option value="parabola">Parabolic reflector (Mode C)</option>
      <option value="cpc">CPC collimator (Mode C)</option>
      <option value="lenscup">Freeform lens profile (Mode C, refract)</option>
      <option value="tir">TIR collimator (lens)</option>
      <option value="fresnel">Fresnel spotlight (lens)</option>
    </select>
    </div>
    <div id="side"></div>
  </aside>
</div>

<script src="js/core.js"></script>
<script src="js/geometry.js"></script>
<script src="js/source.js"></script>
<script src="js/engine.js"></script>
<script src="js/state.js"></script>
<script src="js/solver.js"></script>
<script src="js/modeA.js"></script>
<script src="js/modeB.js"></script>
<script src="js/feasibility.js"></script>
<script src="js/profile.js"></script>
<script src="js/lenses.js"></script>
<script src="js/controller.js"></script>
<script src="js/checks1.js"></script>
<script src="js/checks2.js"></script>
<script src="js/checks3.js"></script>
<script src="js/render.js"></script>
<script src="js/render2d.js"></script>
<script src="js/input.js"></script>
<script src="js/layout.js"></script>
<script src="js/panels.js"></script>
<script src="js/history.js"></script>
<script src="js/ui.js"></script>
<script>
  // If any script failed to load (e.g. a missing file), say so instead of showing a dead page.
  if (!window.RF || !RF.UI) {
    var el = document.getElementById('boot-error');
    el.hidden = false;
    el.textContent = 'The app failed to start: a script did not load (RF.UI missing). Open the browser console for the file name. No HTTP server is needed — index.html runs from file://.';
  }
</script>
</body>
</html>
