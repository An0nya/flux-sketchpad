<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flux — reflector sketchpad</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<noscript><div class="boot-error">This tool needs JavaScript.</div></noscript>
<div id="boot-error" class="boot-error" hidden></div>

<header class="topbar">
  <div class="brand">Flux <span>reflector sketchpad</span></div>
  <nav class="modes" role="tablist" aria-label="Input mode">
    <button role="tab" data-mode="A" title="Paint a target; tile it with source images">A · Paint</button>
    <button role="tab" data-mode="B" title="Stamp tiles on the target; solve the facet for each">B · Stamp</button>
    <button role="tab" data-mode="C" title="Draw a cross-section; revolve or extrude it">C · Profile</button>
  </nav>
  <div class="runbar">
    <label class="rays">Rays <input id="rays-input" data-control="rays" type="number" min="100" max="1000000" step="100"></label>
    <div class="progress" aria-live="polite"><div id="progress-bar"></div><span id="progress-text">—</span></div>
  </div>
  <div class="filebar">
    <button id="btn-generate-top" class="on" title="Solve the reflector for the painted target (Mode A)">Generate reflector</button>
    <select id="preset-select" aria-label="Scene preset">
      <option value="">Presets…</option>
      <option value="headlamp">Headlamp beam (Mode A)</option>
      <option value="deepbox">Tall deep box, source on side wall (Mode A)</option>
      <option value="stamps">Three stamped tiles (Mode B)</option>
      <option value="parabola">Parabolic reflector (Mode C)</option>
      <option value="cpc">CPC collimator (Mode C)</option>
      <option value="lenscup">Freeform lens profile (Mode C, refract)</option>
      <option value="tir">TIR collimator (lens)</option>
      <option value="fresnel">Fresnel spotlight (lens)</option>
    </select>
    <button id="btn-snapshot" title="Save a snapshot in this browser (separate from autosave)">Save</button>
    <button id="btn-restore">Restore</button>
    <button id="btn-download" title="Download the whole scene as one JSON file">Save file</button>
    <label class="filebtn" title="Load a scene JSON file">Open file<input id="file-input" type="file" accept=".json,application/json" hidden></label>
    <button id="btn-reset" class="danger" data-confirm="Reset the whole scene?">Reset</button>
  </div>
</header>

<main class="layout">
  <section class="panel scene-panel">
    <div class="panel-head">
      <h2>Scene <small>isometric · drag to orbit, handles to edit</small></h2>
      <div class="seg" role="group" aria-label="Scene view extent">
        <button data-fit="fixture" class="on">Fixture</button><button data-fit="all">Whole scene</button>
      </div>
      <label class="tog lens" title="Lens focal length, 35 mm-equivalent. ∞ = orthographic (no perspective).">lens <input type="range" id="lens" min="0" max="100" step="1" value="100"> <output id="lens-out">∞</output></label>
      <label class="tog" title="On: orbit keeps the horizon level. Off: free trackball rotation."><input type="checkbox" id="turntable" checked> turntable</label>
      <label class="tog"><input type="checkbox" id="show-rays" checked> rays</label>
    </div>
    <div class="canvas-wrap"><canvas id="scene-canvas" aria-label="3D scene view"></canvas>
      <div class="hint" id="scene-hint"></div></div>
  </section>

  <section class="panel target-panel">
    <div class="panel-head">
      <h2 id="target-title">Target</h2>
      <label>Grid <input data-control="tgt.res" type="number" min="10" max="100" step="1" class="w4"></label>
      <select data-control-view="view" aria-label="Heatmap component">
        <option value="total">total</option><option value="direct">direct only</option><option value="reflected">via surfaces</option>
      </select>
      <label class="tog" title="Blurs the PICTURE only. Every statistic uses the raw accumulator."><input type="checkbox" id="smooth"> display smoothing</label>
    </div>
    <div class="twin">
      <figure class="twin-a">
        <figcaption id="left-caption">Intended</figcaption>
        <div class="canvas-wrap sq"><canvas id="left-canvas"></canvas></div>
        <div class="toolrow" id="left-tools"></div>
      </figure>
      <figure class="twin-b">
        <figcaption id="right-caption">Simulated</figcaption>
        <div class="canvas-wrap sq"><canvas id="heat-canvas"></canvas></div>
        <div class="toolrow" id="right-tools"><span id="colorbar"></span></div>
      </figure>
    </div>
  </section>

  <section class="panel surface-panel">
    <div class="panel-head">
      <h2>Surfaces <small>optics only</small></h2>
      <select data-control-view="surfaceView" aria-label="Surface view style">
        <option value="shaded">shaded + normals</option><option value="pairs">ray pairs</option>
      </select>
    </div>
    <div class="canvas-wrap"><canvas id="surface-canvas" aria-label="Surface view"></canvas></div>
  </section>

  <section class="panel stats-panel">
    <div class="stats-grid">
      <div class="stats" id="stats"></div>
      <div class="feas" id="feasibility" aria-live="polite"></div>
    </div>
    <div class="notices" id="notices"></div>
  </section>

  <aside class="panel side" id="side"></aside>
</main>

<script src="js/core.js"></script>
<script src="js/geometry.js"></script>
<script src="js/source.js"></script>
<script src="js/engine.js"></script>
<script src="js/state.js"></script>
<script src="js/solver.js"></script>
<script src="js/modeA.js"></script>
<script src="js/modeB.js"></script>
<script src="js/feasibility.js"></script>
<script src="js/profile.js"></script>
<script src="js/lenses.js"></script>
<script src="js/controller.js"></script>
<script src="js/checks1.js"></script>
<script src="js/checks2.js"></script>
<script src="js/checks3.js"></script>
<script src="js/render.js"></script>
<script src="js/render2d.js"></script>
<script src="js/input.js"></script>
<script src="js/panels.js"></script>
<script src="js/ui.js"></script>
<script>
  // If any script failed to load (e.g. a missing file), say so instead of showing a dead page.
  if (!window.RF || !RF.UI) {
    var el = document.getElementById('boot-error');
    el.hidden = false;
    el.textContent = 'The app failed to start: a script did not load (RF.UI missing). Open the browser console for the file name. No HTTP server is needed — index.html runs from file://.';
  }
</script>
</body>
</html>
